services:
  telegram-bot-api:
    # 固定版本：私聊卡片用到的 Rich Messages 需要 Bot API 10.3（见 docs/adr/0001）
    image: aiogram/telegram-bot-api:10.3
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: "true"
    ports:
      - "8081:8081"
    volumes:
      - shared-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_BASE_URL: http://telegram-bot-api:8081
      SUPER_ADMIN_ID: ${SUPER_ADMIN_ID}
      DOWNLOAD_DIR: /var/lib/telegram-bot-api/downloads
    volumes:
      - bot-data:/app/data
      - shared-data:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api
    restart: unless-stopped

volumes:
  shared-data:
  bot-data:
